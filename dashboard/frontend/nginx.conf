# 이미지에 함께 굽는 기본 설정. `docker run`으로 단독 실행할 때 쓰인다.
#
# Kubernetes에 배포하면 k8s/dashboard/frontend-configmap.yaml이 이 파일을 덮어쓴다.
# 백엔드 주소를 바꿔야 하면 그쪽을 고친다. 이 파일은 이미지를 다시 빌드해야 반영된다.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE는 버퍼링되면 이벤트가 실시간으로 도착하지 않는다. (명세 2-1)
    location /dashboard/stream {
        proxy_pass http://dashboard-backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /dashboard/ {
        proxy_pass http://dashboard-backend:8080;
        proxy_http_version 1.1;
    }
}
