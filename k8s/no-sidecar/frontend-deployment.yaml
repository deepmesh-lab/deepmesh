apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: deepmesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: kimgooner/frontend:v3
          ports:
            - containerPort: 80
          # 사이드카 판본과 같은 ConfigMap을 쓴다(k8s/frontend/configmap.yaml).
          # /api/** 프록시가 거기 있고, 없으면 SPA fallback이 API를 삼켜 화면이 빈다.
          #
          # VITE_* 런타임 env는 두지 않는다. 빌드 시점에 구워지는 값이라 효과가 없다.
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx
