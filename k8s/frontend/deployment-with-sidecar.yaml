apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: deepmesh
spec:
  replicas: 2
  # 순차 롤아웃 — 한 번에 Pod 하나씩만 교체한다. 사이드카 이미지가 ~367MB라
  # 여러 replica가 동시에 pull하면 호스트 NIC에 대용량 전송이 몰린다(구형 랜카드
  # 버그로 실제 장애를 겪었다). maxSurge:0으로 새 Pod을 먼저 띄우지 않아 pull이
  # 정확히 하나씩 순차로 일어난다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        # 사이드카와 같은 이미지를 쓰되 root로 실행한다 (iptables 규칙 주입).
        - name: iptables-init
          image: kimgooner/reverse-proxy:v2
          # 태그를 재사용하므로 기본값(IfNotPresent)이면 노드가 캐시된 옛 이미지를 쓴다.
          imagePullPolicy: Always
          command: ["sh", "/app/iptables.sh"]
          env:
            # 백엔드 3종과 달리 메인 컨테이너가 nginx라 80이다.
            - name: TARGET_PORT
              value: "80"
            - name: PROXY_PORT
              value: "9011"
            - name: PROXY_UID
              value: "1337"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]

      containers:
        - name: frontend
          image: kimgooner/frontend:v3
          ports:
            - containerPort: 80
          # nginx 설정을 통째로 덮어쓴다. /api/**를 백엔드로 넘기는 프록시가 여기 있다.
          # 이 마운트가 없으면 이미지 안의 설정이 쓰이는데, 그쪽이 옛것이면 SPA fallback이
          # API 요청까지 삼켜 화면이 빈다.
          #
          # VITE_* 런타임 env는 두지 않는다. 그 값들은 빌드 시점에 번들로 구워지므로
          # Deployment에 넣어도 아무 효과가 없고, 주소가 설정된 것처럼 보이게 만들어
          # 오해만 부른다. 실제 주소는 위 ConfigMap의 proxy_pass에 있다.
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          # 프로브를 서비스 포트(80) 밖으로 뺀다. iptables는 TARGET_PORT(80)만
          # 리다이렉트하므로 이 포트로 오는 kubelet 프로브는 사이드카를 거치지 않는다.
          # 그대로 두면 10초마다 오는 프로브 응답이 탐지 대상이 되어, 대시보드에
          # 사라지지 않는 frontend→external 선으로 남는다(트래픽이 아니라 관측 장치다).
          # 백엔드 3종이 MANAGEMENT_SERVER_PORT로 푼 것과 같은 방법이고, 8081 리스너는
          # frontend-nginx ConfigMap에 있다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

        # 컨테이너 이름은 바꾸지 말 것 — Control Plane의 Pod 디스커버리 기준이다
        # (SIDECAR_CONTAINER=reverse-proxy)
        - name: reverse-proxy
          image: kimgooner/reverse-proxy:v2
          # 태그를 재사용하므로 기본값(IfNotPresent)이면 노드가 캐시된 옛 이미지를 쓴다.
          imagePullPolicy: Always
          ports:
            - containerPort: 9011
          securityContext:
            # iptables.sh의 `--uid-owner 1337 -j RETURN`과 짝이다. 어긋나면
            # 프록시가 전달하는 트래픽이 자기 자신에게 다시 리다이렉트된다.
            runAsUser: 1337
            capabilities:
              # AF_PACKET raw 소켓으로 프레임을 캡처하는 데 필요하다.
              # 이미지의 python 바이너리에 파일 capability(cap_net_raw+ep)가 붙어 있어
              # 여기서 drop하면 탐지가 꺼지는 게 아니라 사이드카가 기동하지 못한다.
              add: ["NET_RAW"]
          env:
            - name: TARGET_PORT
              value: "80"
            - name: PROXY_PORT
              value: "9011"
            - name: SNIFF_IFACE
              value: "lo"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # 텔레메트리 이벤트의 출처 식별에 쓴다. 주입하지 않으면 config.py의 기본값이
            # 그대로 나가 podName·nodeName이 "unknown", namespace가 "default"로 저장된다.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # 모델 디렉터리 이름과 같아서 DETECTION_SERVICE를 따로 주지 않아도 된다
            # (백엔드는 "auth-service"라 접미사를 떼야 "auth"가 된다).
            - name: SERVICE_NAME
              value: frontend
            - name: CONTROL_PLANE_URL
              valueFrom:
                configMapKeyRef:
                  name: deepmesh-config
                  key: CONTROL_PLANE_URL
            # 판정 배치를 보낼 곳. 비어 있으면 텔레메트리가 통째로 비활성이라
            # 대시보드에 데이터가 하나도 오지 않는다.
            - name: DASHBOARD_URL
              valueFrom:
                configMapKeyRef:
                  name: deepmesh-config
                  key: DASHBOARD_URL
            # 탐지 모듈 결합. 이 둘이 없으면 build_adapter가 NullDetectionAdapter를
            # 골라 Forward 전용으로 동작한다 (proxy/README.md).
            - name: CONVERTER_FACTORY
              value: traffic_handler.detection_binding:build_converter
            - name: DETECTOR_FACTORY
              value: traffic_handler.detection_binding:build_detector
            - name: MODEL_ROOT
              value: /app/model
            # 모델 디렉터리 이름. SERVICE_NAME에서 "-service"를 뗀 값이 기본이지만,
            # 어긋나면 기동 시 FileNotFoundError로 드러나므로 명시해 둔다.
            - name: DETECTION_SERVICE
              value: frontend
          volumeMounts:
            - name: model
              mountPath: /app/model
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 9011
            initialDelaySeconds: 3
            periodSeconds: 5

      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: deepmesh-model-pvc
        - name: nginx-conf
          configMap:
            name: frontend-nginx
