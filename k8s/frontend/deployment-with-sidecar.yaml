apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: deepmesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        # 사이드카와 같은 이미지를 쓰되 root로 실행한다 (iptables 규칙 주입).
        - name: iptables-init
          image: kimgooner/reverse-proxy:v2
          # 태그를 재사용하므로 기본값(IfNotPresent)이면 노드가 캐시된 옛 이미지를 쓴다.
          imagePullPolicy: Always
          command: ["sh", "/app/iptables.sh"]
          env:
            # 백엔드 3종과 달리 메인 컨테이너가 nginx라 80이다.
            - name: TARGET_PORT
              value: "80"
            - name: PROXY_PORT
              value: "9011"
            - name: PROXY_UID
              value: "1337"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]

      containers:
        - name: frontend
          image: kimgooner/frontend:v3
          ports:
            - containerPort: 80
          env:
            - name: VITE_AUTH_API_URL
              valueFrom:
                configMapKeyRef:
                  name: deepmesh-config
                  key: AUTH_SERVICE_URL
            - name: VITE_POST_API_URL
              valueFrom:
                configMapKeyRef:
                  name: deepmesh-config
                  key: POST_SERVICE_URL
            - name: VITE_COMMENT_API_URL
              valueFrom:
                configMapKeyRef:
                  name: deepmesh-config
                  key: COMMENT_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

        # 컨테이너 이름은 바꾸지 말 것 — Control Plane의 Pod 디스커버리 기준이다
        # (SIDECAR_CONTAINER=reverse-proxy)
        - name: reverse-proxy
          image: kimgooner/reverse-proxy:v2
          # 태그를 재사용하므로 기본값(IfNotPresent)이면 노드가 캐시된 옛 이미지를 쓴다.
          imagePullPolicy: Always
          ports:
            - containerPort: 9011
          securityContext:
            # iptables.sh의 `--uid-owner 1337 -j RETURN`과 짝이다. 어긋나면
            # 프록시가 전달하는 트래픽이 자기 자신에게 다시 리다이렉트된다.
            runAsUser: 1337
            capabilities:
              # AF_PACKET raw 소켓으로 프레임을 캡처하는 데 필요하다.
              # 이미지의 python 바이너리에 파일 capability(cap_net_raw+ep)가 붙어 있어
              # 여기서 drop하면 탐지가 꺼지는 게 아니라 사이드카가 기동하지 못한다.
              add: ["NET_RAW"]
          env:
            - name: TARGET_PORT
              value: "80"
            - name: PROXY_PORT
              value: "9011"
            - name: SNIFF_IFACE
              value: "lo"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # 모델 디렉터리 이름과 같아서 DETECTION_SERVICE를 따로 주지 않아도 된다
            # (백엔드는 "auth-service"라 접미사를 떼야 "auth"가 된다).
            - name: SERVICE_NAME
              value: frontend
            - name: CONTROL_PLANE_URL
              valueFrom:
                configMapKeyRef:
                  name: deepmesh-config
                  key: CONTROL_PLANE_URL
            # 판정 배치를 보낼 곳. 비어 있으면 텔레메트리가 통째로 비활성이라
            # 대시보드에 데이터가 하나도 오지 않는다.
            - name: DASHBOARD_URL
              valueFrom:
                configMapKeyRef:
                  name: deepmesh-config
                  key: DASHBOARD_URL
            # 탐지 모듈 결합. 이 둘이 없으면 build_adapter가 NullDetectionAdapter를
            # 골라 Forward 전용으로 동작한다 (proxy/README.md).
            - name: CONVERTER_FACTORY
              value: traffic_handler.detection_binding:build_converter
            - name: DETECTOR_FACTORY
              value: traffic_handler.detection_binding:build_detector
            - name: MODEL_ROOT
              value: /app/model
            # 모델 디렉터리 이름. SERVICE_NAME에서 "-service"를 뗀 값이 기본이지만,
            # 어긋나면 기동 시 FileNotFoundError로 드러나므로 명시해 둔다.
            - name: DETECTION_SERVICE
              value: frontend
          volumeMounts:
            - name: model
              mountPath: /app/model
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 9011
            initialDelaySeconds: 3
            periodSeconds: 5

      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: deepmesh-model-pvc
