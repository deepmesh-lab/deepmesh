apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: deepmesh
data:
  # 이 파일이 컨테이너의 /etc/nginx/conf.d/default.conf를 덮어쓴다(이미지의
  # msa/frontend/nginx.conf 자리). 백엔드 주소를 바꿔야 하면 이미지를 다시 빌드하지 말고
  # 이 값만 고친 뒤 kubectl rollout restart 하면 된다.
  #
  # 둘은 같은 내용을 유지한다. 이미지 단독으로 띄울 때는 이미지 안의 것이 쓰인다.
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 백엔드 주소를 변수에 담아 **요청이 올 때** 해석한다.
        #
        # proxy_pass에 이름을 그대로 쓰면 nginx가 시작하는 시점에 DNS를 찾는다. 그때 대상
        # 서비스가 아직 없으면 "host not found in upstream"으로 컨테이너가 아예 뜨지 못한다.
        # 변수로 두면 서비스가 없어도 화면은 뜨고 그 /api 요청만 502가 된다.
        #
        # kube-dns 이름이 해석되지 않는 클러스터라면 아래 주소를
        # `kubectl -n kube-system get svc kube-dns` 의 CLUSTER-IP로 바꾼다.
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        set $auth_service    "auth-service.deepmesh.svc.cluster.local:8080";
        set $post_service    "post-service.deepmesh.svc.cluster.local:8080";
        set $comment_service "comment-service.deepmesh.svc.cluster.local:8080";

        # 파일 이름에 해시가 붙는 번들이라 오래 캐시해도 안전하다.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # /api/**를 백엔드로 넘긴다.
        #
        # 이 블록들이 없으면 아래 SPA fallback이 API 요청까지 삼켜 GET에는 index.html을,
        # POST에는 405를 돌려준다. 앱은 그 HTML을 응답 객체로 알고 .length를 부르다 죽고
        # 화면이 통째로 빈다. 실제로 그렇게 깨져 있었다.
        #
        # 앱은 같은 오리진으로 요청하므로(이미지가 VITE_*_API_URL="" 로 빌드되어 있다)
        # 백엔드에 CORS 설정이 필요 없다.
        location /api/auth/ {
            proxy_pass http://$auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/posts {
            proxy_pass http://$post_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/comments {
            proxy_pass http://$comment_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA. /posts 같은 주소를 새로고침해도 라우터가 처리하도록 넘긴다.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
