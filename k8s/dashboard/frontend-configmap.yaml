apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-frontend-nginx
  namespace: deepmesh
data:
  # 이 파일이 컨테이너의 /etc/nginx/conf.d/default.conf를 덮어쓴다.
  # 백엔드 주소를 바꿔야 하면 이미지를 다시 빌드하지 말고 이 값만 고친 뒤
  # kubectl rollout restart 하면 된다.
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 백엔드 주소를 변수에 담아 **요청이 올 때** 해석한다.
        #
        # proxy_pass에 이름을 그대로 쓰면 nginx가 시작하는 시점에 DNS를 찾는다.
        # 그때 dashboard-backend가 아직 없으면 "host not found in upstream"으로
        # 컨테이너가 아예 뜨지 못한다. 변수로 두면 백엔드가 없어도 화면은 뜨고
        # /dashboard 요청만 502가 된다. (목 모드로는 백엔드 없이도 동작한다)
        #
        # kube-dns 이름이 해석되지 않는 클러스터라면 아래 주소를
        # `kubectl -n kube-system get svc kube-dns` 의 CLUSTER-IP로 바꾼다.
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        set $dashboard_backend "dashboard-backend.deepmesh.svc.cluster.local:8080";

        # 컨테이너 자체의 생존 확인용. 백엔드 상태와 무관해야 한다.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 파일 이름에 해시가 붙는 번들이라 오래 캐시해도 안전하다.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SSE는 버퍼링되면 이벤트가 실시간으로 도착하지 않는다. (명세 2-1)
        location /dashboard/stream {
            proxy_pass http://$dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            # SSE는 오래 열려 있는 연결이다. 기본 60초로는 계속 끊긴다.
            proxy_read_timeout 3600s;
        }

        location /dashboard/ {
            proxy_pass http://$dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA. /graph 같은 주소를 새로고침해도 라우터가 처리하도록 넘긴다.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
