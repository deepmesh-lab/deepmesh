# 이름을 바꾸지 말 것 — 대시보드 프론트의 nginx가
# dashboard-backend.deepmesh.svc.cluster.local:8080으로 프록시한다.
apiVersion: v1
kind: Service
metadata:
  name: dashboard-backend
  namespace: deepmesh
spec:
  type: ClusterIP
  selector:
    app: dashboard-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
