apiVersion: apps/v1
kind: Deployment
metadata:
  name: comment-service
  namespace: deepmesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: comment-service
  template:
    metadata:
      labels:
        app: comment-service
    spec:
      initContainers:
        # 사이드카와 같은 이미지를 쓰되 root로 실행한다 (iptables 규칙 주입).
        - name: iptables-init
          image: kimgooner/reverse-proxy:v2
          command: ["sh", "/app/iptables.sh"]
          env:
            - name: TARGET_PORT
              value: "8080"
            - name: PROXY_PORT
              value: "9011"
            - name: PROXY_UID
              value: "1337"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]

      containers:
        - name: comment-service
          image: uicheolshin/comment-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: deepmesh-config
                  key: COMMENTS_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deepmesh-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: deepmesh-secret
                  key: JWT_SECRET
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

        # 컨테이너 이름은 바꾸지 말 것 — Control Plane의 Pod 디스커버리 기준이다
        # (SIDECAR_CONTAINER=reverse-proxy)
        - name: reverse-proxy
          image: kimgooner/reverse-proxy:v2
          ports:
            - containerPort: 9011
          securityContext:
            # iptables.sh의 `--uid-owner 1337 -j RETURN`과 짝이다. 어긋나면
            # 프록시가 전달하는 트래픽이 자기 자신에게 다시 리다이렉트된다.
            runAsUser: 1337
            capabilities:
              # AF_PACKET raw 소켓으로 프레임을 캡처하는 데 필요하다.
              # 이미지의 python 바이너리에 파일 capability(cap_net_raw+ep)가 붙어 있어
              # 여기서 drop하면 탐지가 꺼지는 게 아니라 사이드카가 기동하지 못한다.
              add: ["NET_RAW"]
          env:
            - name: TARGET_PORT
              value: "8080"
            - name: PROXY_PORT
              value: "9011"
            - name: SNIFF_IFACE
              value: "lo"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SERVICE_NAME
              value: comment-service
            - name: CONTROL_PLANE_URL
              valueFrom:
                configMapKeyRef:
                  name: deepmesh-config
                  key: CONTROL_PLANE_URL
          readinessProbe:
            tcpSocket:
              port: 9011
            initialDelaySeconds: 3
            periodSeconds: 5
