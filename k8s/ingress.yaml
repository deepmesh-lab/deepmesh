apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deepmesh-ingress
  namespace: deepmesh
  # rewrite-target을 쓰지 않는다. path가 정규식 캡처 없는 Prefix라
  # `rewrite-target: /`를 걸면 /api/auth/login 같은 요청이 백엔드에 `/`로 도착해
  # 전 API가 깨진다. 캡처를 쓰려면 use-regex와 `/api/auth(/|$)(.*)` 형태가 함께 필요하다.
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8080
          - path: /api/posts
            pathType: Prefix
            backend:
              service:
                name: post-service
                port:
                  number: 8080
          - path: /api/comments
            pathType: Prefix
            backend:
              service:
                name: comment-service
                port:
                  number: 8080
