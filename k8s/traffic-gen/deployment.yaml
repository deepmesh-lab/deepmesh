# 상시 정상 east-west 트래픽 생성기.
#
# 대시보드 토폴로지는 최근 5분만 본다(TimeRange 기본값). 아무도 트래픽을 넣지 않으면
# 서비스 간 엣지가 5분 안에 화면에서 사라져, 데모를 열 때마다 생성기를 손으로 돌려야 했다.
# 이 Deployment가 그 자리를 메운다 — 죽어도 다시 뜨고, 끝나지 않는다.
#
# 시나리오는 traffic-gen-script ConfigMap에 있다(configmap.yaml). 무엇을 어떤 모양으로
# 보내는지는 거기 주석에 적었다.
#
# 사이드카는 붙이지 않는다. 이 Pod는 트래픽의 출처일 뿐이고, 탐지 대상은 이 요청을 받은
# 서비스가 내보내는 east-west egress다. 같은 이유로 대시보드 토폴로지에서도 빠진다
# (dashboard-backend의 deepmesh.topology.exclude 기본값에 traffic-gen이 들어 있다).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-gen
  namespace: deepmesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-gen
  template:
    metadata:
      labels:
        app: traffic-gen
      annotations:
        # 스크립트를 고치면 Pod가 새로 뜨도록 손으로 올리는 값. ConfigMap만 바꾸고
        # 놔두면 이미 떠 있는 Pod는 옛 스크립트를 계속 돌린다.
        deepmesh.io/script-revision: "8"
    spec:
      containers:
        - name: gen
          image: curlimages/curl:8.10.1
          command: ["sh", "/scripts/gen.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: traffic-gen-script
